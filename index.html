</style></head><body><main class="app"><header class="top"><div class="brand"><span class="mark">✳</span>时笺</div><span class="topnote">A NOTE IN TIME</span></header><div class="intro arrival"><div><div class="eyebrow">NOTES FOR YOUR DAYS</div><h1>把时光写下来</h1><p>把想做的事，轻轻放进日子里。</p></div><svg class="sun" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="21" fill="#e8c77e"/><g stroke="#bc9b5e" stroke-width="1.5" stroke-linecap="round"><path d="M40 7v7M40 66v7M7 40h7M66 40h7M16 16l5 5M59 59l5 5M64 16l-5 5M21 59l-5 5"/><path d="M34 43q6 6 12 0" fill="none"/></g><circle cx="33" cy="36" r="1.2" fill="#9c8050"/><circle cx="47" cy="36" r="1.2" fill="#9c8050"/></svg></div><section class="calendar arrival" aria-label="一周日历"><div class="cal-head"><div class="month" id="month"></div><div class="nav"><button id="prev" aria-label="上一周">‹</button><button class="today" id="today">今天</button><button id="next" aria-label="下一周">›</button></div></div><div class="week" id="week"></div><div class="cal-foot"><span>这一周的时光</span><span>小点表示有安排 ·</span></div></section><section class="section arrival"><div class="section-head"><div><h2 id="heading">今日笺</h2><div class="sub" id="date-label"></div></div><div class="count" id="count"></div></div><div class="filters" id="filters"><button class="filter active" data-filter="全部">全部</button><button class="filter" data-filter="生活">生活</button><button class="filter" data-filter="工作">工作</button><button class="filter" data-filter="个人">个人</button><button class="filter" data-filter="待安排">待安排</button></div><div class="list" id="list"></div></section><div class="backup"><button id="export" type="button">导出备份</button><button id="import" type="button">导入备份</button><input id="backup-file" type="file" accept="application/json,.json" hidden></div></main><div class="bottom"><button class="add" id="add"><b>＋</b>写一张笺</button></div><dialog id="dialog"><form class="sheet" id="form"><div class="sheet-head"><h2 id="form-title">写一张笺</h2><button type="button" class="close" id="close" aria-label="关闭">×</button></div><label class="field">写下想做的事<input id="title" required maxlength="100" placeholder="比如：去买一束花…" autocomplete="off"></label><div class="row"><label class="field">安排在<input id="date" type="date"></label><label class="field">分类<select id="category"><option>生活</option><option>工作</option><option>个人</option></select></label></div><button class="save" type="submit">收进时笺</button></form></dialog><script>
const key='little-day-v1'; const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; const parse=s=>new Date(s+'T12:00:00'); const today=localDate(new Date());let selected=today,filter='全部',editing=null;let tasks;try{tasks=JSON.parse(localStorage.getItem(key));if(!Array.isArray(tasks))throw 0}catch{tasks=[{id:1,title:'整理一下这周的计划',date:today,category:'个人',done:false},{id:2,title:'出门买点喜欢的水果',date:today,category:'生活',done:false},{id:3,title:'给自己留一点放松时间',date:today,category:'个人',done:true}]};const $=s=>document.querySelector(s);function save(){try{localStorage.setItem(key,JSON.stringify(tasks));return true}catch{alert('保存失败，请检查浏览器的存储设置。');return false}}function monday(d){let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function render(){let d=parse(selected),start=monday(d);$('#month').textContent=`${d.getFullYear()}年 ${d.getMonth()+1}月`;$('#week').innerHTML='';['一','二','三','四','五','六','日'].forEach((w,i)=>{let x=new Date(start);x.setDate(start.getDate()+i);let date=localDate(x),b=document.createElement('button');b.className='day'+(date===selected?' selected':'')+(tasks.some(t=>t.date===date)?' has':'');b.setAttribute('aria-label',`${x.getMonth()+1}月${x.getDate()}日 星期${w}`);b.setAttribute('aria-pressed',date===selected);b.innerHTML=`<span>${w}</span><strong>${x.getDate()}</strong><i></i>`;b.onclick=()=>{selected=date;if(filter==='待安排')filter='全部';render()};$('#week').append(b)});$('#heading').textContent=filter==='待安排'?'待安排':selected===today?'今日笺':'这日的笺';$('#date-label').textContent=filter==='待安排'?'还没有决定日期的事':`${d.getMonth()+1}月${d.getDate()}日 · 星期${'日一二三四五六'[d.getDay()]}`;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));let shown=tasks.filter(t=>filter==='待安排'?!t.date:t.date===selected&&(filter==='全部'||t.category===filter));$('#count').textContent=`${shown.filter(t=>t.done).length} / ${shown.length} 已完成`;let list=$('#list');list.innerHTML='';if(!shown.length){list.innerHTML='<div class="empty">这一页还是空白的<br>想到什么，再慢慢写下来。</div>';return}shown.forEach(t=>{let row=document.createElement('div');row.className='task'+(t.done?' done':'');let check=document.createElement('button');check.className='check';check.textContent=t.done?'✓':'';check.setAttribute('aria-label',t.done?'标记未完成':'标记完成');check.onclick=()=>{t.done=!t.done;save();render()};let text=document.createElement('div');text.className='task-text';let title=document.createElement('div');title.className='task-title';title.textContent=t.title;let meta=document.createElement('div');meta.className='task-meta';let dot=document.createElement('i');dot.className='dot '+({工作:'work',个人:'personal'}[t.category]||'');meta.append(dot,document.createTextNode(t.category));text.append(title,meta);let actions=document.createElement('div');actions.className='actions';let edit=document.createElement('button');edit.className='icon';edit.textContent='✎';edit.setAttribute('aria-label','编辑任务');edit.onclick=()=>open(t);let del=document.createElement('button');del.className='icon';del.textContent='×';del.setAttribute('aria-label','删除任务');del.onclick=()=>{if(confirm('删除这件事？')){tasks=tasks.filter(x=>x.id!==t.id);save();render()}};actions.append(edit,del);row.append(check,text,actions);list.append(row)})}function open(t){editing=t?.id??null;$('#form-title').textContent=t?'编辑这张笺':'写一张笺';$('#title').value=t?.title||'';$('#date').value=t?t.date:(filter==='待安排'?'':selected);$('#category').value=t?.category||'生活';$('.save').textContent=t?'保存修改':'收进时笺';$('#dialog').showModal();$('#title').focus()}$('#add').onclick=()=>open();$('#close').onclick=()=>$('#dialog').close();$('#form').onsubmit=e=>{e.preventDefault();let title=$('#title').value.trim();if(!title)return;let t=tasks.find(x=>x.id===editing);if(t){Object.assign(t,{title,date:$('#date').value,category:$('#category').value})}else tasks.push({id:Date.now()+Math.random(),title,date:$('#date').value,category:$('#category').value,done:false});save();$('#dialog').close();render()};$('#filters').onclick=e=>{let b=e.target.closest('button');if(b){filter=b.dataset.filter;render()}};$('#today').onclick=()=>{selected=today;filter='全部';render()};function shift(n){let d=parse(selected);d.setDate(d.getDate()+n*7);selected=localDate(d);if(filter==='待安排')filter='全部';render()}$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'时笺',version:1,exportedAt:new Date().toISOString(),tasks},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`时笺备份-${localDate(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#import').onclick=()=>$('#backup-file').click();$('#backup-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('文件过大');let data=JSON.parse(await file.text());if(data.app!=='时笺'||data.version!==1||!Array.isArray(data.tasks)||!data.tasks.every(t=>t&&(['string','number'].includes(typeof t.id))&&typeof t.title==='string'&&t.title.trim()&&t.title.length<=100&&typeof t.date==='string'&&(t.date===''||(/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&!isNaN(parse(t.date))))&&['生活','工作','个人'].includes(t.category)&&typeof t.done==='boolean'))throw Error('备份格式不正确');let original=tasks.slice(),known=new Set(tasks.map(t=>String(t.id))),added=0;for(let t of data.tasks){if(!known.has(String(t.id))){tasks.push({id:t.id,title:t.title,date:t.date,category:t.category,done:t.done});known.add(String(t.id));added++}}if(!save()){tasks=original;render();return}render();alert(`已导入 ${added} 条任务；已有任务保持不变。`)}catch(err){alert('无法导入：'+(err.message||'文件不是有效备份'))}finally{e.target.value=''}};
if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
