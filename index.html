ion><section class="section arrival"><div class="section-head"><div><h2 id="heading">今日笺</h2><div class="sub" id="date-label"></div></div><div class="count" id="count"></div></div><div class="filters" id="filters"><button class="filter active" data-filter="全部">全部</button><button class="filter" data-filter="生活">生活</button><button class="filter" data-filter="工作">工作</button><button class="filter" data-filter="个人">个人</button><button class="filter" data-filter="待安排">待安排</button></div><div class="list" id="list"></div></section><div class="backup"><span class="backup-title">把时笺备份下来</span><button id="export" type="button">导出备份</button><button id="import" type="button">导入备份</button><input id="backup-file" type="file" accept="application/json,.json" hidden></div></main><div class="bottom"><button class="add" id="add"><b>＋</b>写一张笺</button></div><dialog id="dialog"><form class="sheet" id="form"><div class="sheet-head"><h2 id="form-title">写一张笺</h2><button type="button" class="close" id="close" aria-label="关闭">×</button></div><label class="field">写下想做的事<input id="title" required maxlength="100" placeholder="比如：去买一束花…" autocomplete="off"></label><div class="row"><label class="field">安排在<input id="date" type="date"></label><label class="field">分类<select id="category"><option>生活</option><option>工作</option><option>个人</option></select></label></div><div class="row"><label class="field">时间（可选）<input id="time" type="time"></label><label class="field">重复<select id="repeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周</option></select></label></div><button class="save" type="submit">收进时笺</button></form></dialog><script>
const key='little-day-v1', $=s=>document.querySelector(s), localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, parse=s=>new Date(s+'T12:00:00'), currentDay=()=>localDate(new Date());
let selected=currentDay(),filter='全部',editing=null,monthView=false,tasks;try{tasks=JSON.parse(localStorage.getItem(key));if(!Array.isArray(tasks))throw 0}catch{tasks=[{id:1,title:'整理一下这周的计划',date:selected,category:'个人',done:false},{id:2,title:'出门买点喜欢的水果',date:selected,category:'生活',done:false},{id:3,title:'给自己留一点放松时间',date:selected,category:'个人',done:true}]}
function save(){try{localStorage.setItem(key,JSON.stringify(tasks));return true}catch{alert('保存失败，请检查浏览器的存储设置。');return false}}
function monday(d){let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function occurs(t,date){if(!t.date||date<t.date)return false;if(!t.repeat||t.repeat==='none')return t.date===date;if(t.repeat==='daily')return true;if(t.repeat==='weekly')return parse(t.date).getDay()===parse(date).getDay();return false}

list=$('#list');list.innerHTML='';if(!shown.length){list.innerHTML='<div class="empty">这一页还是空白的<br>想到什么，再慢慢写下来。</div>';return}shown.forEach(t=>{let done=isDone(t,selected),row=document.createElement('div');row.className='task'+(done?' done':'');let check=document.createElement('button');check.className='check';check.textContent=done?'✓':'';check.setAttribute('aria-label',done?'标记未完成':'标记完成');check.onclick=()=>{if(t.repeat&&t.repeat!=='none'){let dates=new Set(t.completedDates||[]);done?dates.delete(selected):dates.add(selected);t.completedDates=[...dates]}else t.done=!t.done;save();render()};let text=document.createElement('div');text.className='task-text';let title=document.createElement('div');title.className='task-title';title.textContent=t.title;let meta=document.createElement('div');meta.className='task-meta';let dot=document.createElement('i');dot.className='dot '+({工作:'work',个人:'personal'}[t.category]||'');meta.append(dot,document.createTextNode([t.category,t.time,({daily:'每天',weekly:'每周'})[t.repeat]].filter(Boolean).join(' · ')));text.append(title,meta);let actions=document.createElement('div');actions.className='actions';let edit=document.createElement('button');edit.className='icon';edit.textContent='✎';edit.setAttribute('aria-label','编辑任务');edit.onclick=()=>open(t);let del=document.createElement('button');del.className='icon';del.textContent='×';del.setAttribute('aria-label','删除任务');del.onclick=()=>{if(confirm(t.repeat&&t.repeat!=='none'?'删除整个重复任务？所有日期的记录也会删除。':'删除这件事？')){tasks=tasks.filter(x=>x.id!==t.id);save();render()}};actions.append(edit,del);row.append(check,text,actions);list.append(row)})}
function open(t){editing=t?.id??null;$('#form-title').textContent=t?'编辑这张笺':'写一张笺';$('#title').value=t?.title||'';$('#date').value=t?t.date:(filter==='待安排'?'':selected);$('#category').value=t?.category||'生活';$('#time').value=t?.time||'';$('#repeat').value=t?.repeat||'none';$('.save').textContent=t?'保存修改':'收进时笺';$('#dialog').showModal();$('#title').focus()}$('#add').onclick=()=>open();$('#close').onclick=()=>$('#dialog').close();$('#form').onsubmit=e=>{e.preventDefault();let title=$('#title').value.trim(),date=$('#date').value,repeat=$('#repeat').value;if(!title)return;if(repeat!=='none'&&!date){alert('重复任务需要先选择开始日期。');return}let t=tasks.find(x=>x.id===editing),changes={title,date,category:$('#category').value,time:$('#time').value,repeat};if(t){if(((t.repeat||'none')!==repeat||t.date!==date)&&((t.repeat&&t.repeat!=='none')||repeat!=='none')){if(!confirm('更改重复方式或开始日期会清除这个任务的完成记录，继续吗？'))return;t.completedDates=[];t.done=false}Object.assign(t,changes)}else tasks.push({id:Date.now()+Math.random(),...changes,done:false,completedDates:[]});if(save()){$('#dialog').close();render()}};$('#filters').onclick=e=>{let b=e.target.closest('button');if(b){filter=b.dataset.filter;render()}};$('#today').onclick=()=>{selected=currentDay();filter='全部';render()};$('#view-toggle').onclick=()=>{monthView=!monthView;render()};function shift(n){let d=parse(selected);if(monthView){let day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}else d.setDate(d.getDate()+n*7);selected=localDate(d);if(filter==='待安排')filter='全部';render()}$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);

function valid(t){return t&&(['string','number'].includes(typeof t.id))&&typeof t.title==='string'&&!!t.title.trim()&&t.title.length<=100&&typeof t.date==='string'&&(t.date===''||(/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&!isNaN(parse(t.date))&&localDate(parse(t.date))===t.date))&&['生活','工作','个人'].includes(t.category)&&typeof t.done==='boolean'&&(!t.time||/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time))&&(!t.repeat||['none','daily','weekly'].includes(t.repeat))&&(!t.repeat||t.repeat==='none'||!!t.date)&&(!t.completedDates||(Array.isArray(t.completedDates)&&t.completedDates.every(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(parse(d))&&localDate(parse(d))===d)))}
$('#import').onclick=()=>$('#backup-file').click();$('#backup-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('文件过大');let data=JSON.parse(await file.text());if(data.app!=='时笺'||![1,2].includes(data.version)||!Array.isArray(data.tasks)||!data.tasks.every(valid))throw Error('备份格式不正确');let original=tasks.slice(),known=new Set(tasks.map(t=>String(t.id))),added=0;for(let t of data.tasks){if(!known.has(String(t.id))){tasks.push({id:t.id,title:t.title,date:t.date,category:t.category,done:t.done,time:t.time||'',repeat:t.repeat||'none',completedDates:t.completedDates||[]});known.add(String(t.id));added++}}if(!save()){tasks=original;render();return}render();alert(`已导入 ${added} 条任务；已有任务保持不变。`)}catch(err){alert('无法导入：'+(err.message||'文件不是有效备份'))}finally{e.target.value=''}};
